
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management API</title>
</head>

<body>

    <h1>Product Management API</h1>

    <button onclick="getProducts()">View Products</button>
    <button onclick="addProduct()">Add Product</button>
    <button onclick="updateProduct()">Update Product</button>
    <button onclick="updatePrice()">Update Product Price</button>
    <button onclick="deleteProduct()">Delete Product</button>

    <script>
        const API_URL = "https://fakestoreapi.com/products";

        async function getProducts() {
            const response = await fetch(API_URL);
            const data = await response.json();

            console.log("All Products:");
            console.log(data);
        }

        async function addProduct() {
            const product = {
                title: "Wireless Headphones",
                price: 1999,
                category: "electronics"
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            const data = await response.json();

            console.log("Product Added:");
            console.log(data);
        }

        async function updateProduct() {
            const product = {
                title: "Updated Wireless Headphones",
                price: 2499,
                category: "electronics"
            };

            const response = await fetch(`${API_URL}/1`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            const data = await response.json();

            console.log("Product Updated:");
            console.log(data);
        }

        async function updatePrice() {
            const response = await fetch(`${API_URL}/1`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    price: 2999
                })
            });

            const data = await response.json();

            console.log("Product Price Updated:");
            console.log(data);
        }

        async function deleteProduct() {
            const response = await fetch(`${API_URL}/1`, {
                method: "DELETE"
            });

            const data = await response.json();

            console.log("Product Deleted:");
            console.log(data);
        }
    </script>

</body>
</html>
