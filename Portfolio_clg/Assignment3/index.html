<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <form id="feedbackForm">

        <label>Student Name</label>
        <input type="text" id="name">
        <small id="nameError" class="error"></small>

        <label>Email</label>
        <input type="email" id="email">
        <small id="emailError" class="error"></small>

        <label>Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>
        <small id="courseError" class="error"></small>

        <label>Feedback</label>
        <textarea id="feedback" rows="5"></textarea>
        <small id="feedbackError" class="error"></small>

        <br><br>

        <button type="submit">Submit Feedback</button>
        <button type="button" id="deleteBtn">Delete Stored Data</button>

    </form>

    <h2 id="sessionUser"></h2>

    <h2>Stored Feedback</h2>

    <div id="storedData">
        No feedback stored.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
