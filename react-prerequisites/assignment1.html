<!DOCTYPE html>
<html>
<head>
    <title>Assignment 1 - Profile Card</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f0e8;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 330px;
            padding: 35px;
            background: white;
            text-align: center;
            border: 1px solid #d5d3ca;
            border-radius: 25px;
            box-shadow: 0 2px 5px #00000008;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px #00000018;
        }

        .avatar {
            width: 130px;
            height: 130px;
            margin: auto;
            border-radius: 50%;
            background: #b6d4f3;
            color: #174b7b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            margin: 16px 0 6px;
            color: #292929;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.5;
            margin: 0 0 22px;
        }

        .skill {
            display: inline-block;
            background: #e6f1fc;
            color: #174b7b;
            padding: 5px 16px;
            border-radius: 20px;
            margin: 0 3px 20px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #292929;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">RS</div>
        <h1>Ravi Sharma</h1>
        <p>Frontend learner who loves<br> building small web apps.</p>

        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JS</span>

        <button>Follow</button>
    </div>
</body>
</html>
