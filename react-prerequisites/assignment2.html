<!DOCTYPE html>
<html>
<head>
    <title>Assignment 2 - Counter</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f0e8;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 430px;
            padding: 30px;
            text-align: center;
            background: white;
            border: 1px solid #d5d3ca;
            border-radius: 24px;
        }

        h1 { color: #333; }

        #number {
            font-size: 95px;
            font-weight: bold;
            color: green;
            margin: 10px 0 25px;
        }

        button {
            background: white;
            border: 1px solid #888;
            border-radius: 12px;
            padding: 10px 22px;
            margin: 4px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover { background: #eee; }

        p { color: #666; font-size: 17px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Counter</h1>
        <div id="number">0</div>

        <button onclick="decrease()">Decrease</button>
        <button onclick="reset()">Reset</button>
        <button onclick="increase()">Increase</button>

        <p>Green above 0, red below 0, maximum 10</p>
    </div>

    <script>
        let count = 0;

        function updateNumber() {
            document.getElementById("number").innerText = count;

            // Change the colour using a ternary operator
            document.getElementById("number").style.color =
                count > 0 ? "green" : count < 0 ? "red" : "black";
        }

        function decrease() {
            count--;
            updateNumber();
        }

        function reset() {
            count = 0;
            updateNumber();
        }

        function increase() {
            if (count < 10) {
                count++;
            }
            updateNumber();
        }
    </script>
</body>
</html>
