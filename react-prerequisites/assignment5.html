<!DOCTYPE html>
<html>
<head>
    <title>Assignment 5 - Product List</title>
    <style>
        body {
            margin: 0;
            padding: 35px;
            background: #f1f0e8;
            font-family: Arial, sans-serif;
        }

        .container { max-width: 950px; margin: auto; }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 22px;
        }

        button, select {
            padding: 10px 20px;
            border: 1px solid #888;
            border-radius: 12px;
            background: white;
            font-size: 17px;
            cursor: pointer;
            margin-right: 5px;
        }

        button.active {
            background: #292929;
            color: white;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card {
            padding: 18px;
            background: white;
            border: 1px solid #d5d3ca;
            border-radius: 18px;
        }

        .picture {
            height: 90px;
            border-radius: 13px;
            margin-bottom: 12px;
        }

        .card h3 { margin: 5px 0; }
        .category { color: #666; margin: 5px 0; }
        .price { font-size: 19px; margin: 8px 0 0; }

        #total {
            text-align: right;
            font-size: 20px;
            margin-top: 25px;
        }

        @media (max-width: 750px) {
            .products { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 450px) {
            .products { grid-template-columns: 1fr; }
            body { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <div id="categoryButtons">
                <button class="active" onclick="filterProducts('All', this)">All</button>
                <button onclick="filterProducts('Electronics', this)">Electronics</button>
                <button onclick="filterProducts('Clothes', this)">Clothes</button>
                <button onclick="filterProducts('Books', this)">Books</button>
            </div>

            <select id="sortPrice" onchange="showProducts()">
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
            </select>
        </div>

        <div class="products" id="productList"></div>
        <p id="total"></p>
    </div>

    <script>
        let products = [
            { name: "Earphones", category: "Electronics", price: 499, color: "#b6d4f3" },
            { name: "JS book", category: "Books", price: 650, color: "#c2dfa0" },
            { name: "T-shirt", category: "Clothes", price: 799, color: "#cfcbf5" },
            { name: "Smart watch", category: "Electronics", price: 2499, color: "#ffca78" },
            { name: "HTML book", category: "Books", price: 550, color: "#b9dfd4" },
            { name: "Jeans", category: "Clothes", price: 1299, color: "#e5c3a5" },
            { name: "Keyboard", category: "Electronics", price: 999, color: "#d5d5d5" },
            { name: "CSS book", category: "Books", price: 750, color: "#e8c5d5" }
        ];

        let selectedCategory = "All";

        function filterProducts(category, button) {
            selectedCategory = category;

            let buttons = document.querySelectorAll("#categoryButtons button");
            buttons.forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");

            showProducts();
        }

        function showProducts() {
            let shownProducts = products.filter(product => {
                return selectedCategory === "All" ||
                    product.category === selectedCategory;
            });

            let order = document.getElementById("sortPrice").value;

            if (order === "low") {
                shownProducts = [...shownProducts].sort((a, b) => a.price - b.price);
            } else {
                shownProducts = [...shownProducts].sort((a, b) => b.price - a.price);
            }

            document.getElementById("productList").innerHTML =
                shownProducts.map(({ name, category, price, color }) => `
                    <div class="card">
                        <div class="picture" style="background:${color}"></div>
                        <h3>${name}</h3>
                        <p class="category">${category}</p>
                        <p class="price">Rs. ${price.toLocaleString("en-IN")}</p>
                    </div>
                `).join("");

            let totalPrice = shownProducts.reduce((total, product) => {
                return total + product.price;
            }, 0);

            document.getElementById("total").innerHTML =
                "Total of shown products: <b>Rs. " +
                totalPrice.toLocaleString("en-IN") + "</b>";
        }

        showProducts();
    </script>
</body>
</html>
