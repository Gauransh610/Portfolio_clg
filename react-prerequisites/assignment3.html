<!DOCTYPE html>
<html>
<head>
    <title>Assignment 3 - Theme Toggle</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f0e8;
            font-family: Arial, sans-serif;
            transition: 0.3s;
        }

        .page {
            width: 500px;
            padding: 35px;
            background: white;
            border: 1px solid #bbb9b0;
            border-radius: 18px;
            color: #292929;
        }

        h1 { margin-top: 10px; }

        p {
            font-size: 19px;
            line-height: 1.5;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        body.dark {
            background: #292929;
        }

        body.dark .page {
            background: #292929;
            color: #f5f1e8;
            border-color: #555;
        }

        body.dark button {
            background: #f5f1e8;
            color: #292929;
        }
    </style>
</head>
<body>
    <div class="page">
        <p>Light theme</p>
        <h1>Welcome to my page</h1>
        <p>This paragraph changes colour when the theme changes.</p>
        <button id="themeButton" onclick="changeTheme()">Switch to Dark</button>
    </div>

    <script>
        function changeTheme() {
            document.body.classList.toggle("dark");

            let button = document.getElementById("themeButton");

            button.innerText = document.body.classList.contains("dark")
                ? "Switch to Light"
                : "Switch to Dark";
        }
    </script>
</body>
</html>
