<!DOCTYPE html>
<html>
<head>
    <title>Assignment 8 - Student Manager</title>
    <style>
        body {
            margin: 0;
            padding: 35px;
            background: #f1f0e8;
            font-family: Arial, sans-serif;
        }

        .container { max-width: 900px; margin: auto; }

        h1 { color: #292929; }

        form {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #aaa;
            border-radius: 12px;
            font-size: 17px;
        }

        button {
            padding: 9px 17px;
            border: 1px solid #888;
            border-radius: 12px;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        #saveButton {
            background: #292929;
            color: white;
            border: none;
            padding: 12px 22px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #d5d3ca;
            border-radius: 15px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd9cf;
            font-size: 17px;
        }

        th {
            background: #f1f0e8;
            color: #666;
            font-weight: normal;
        }

        #message { color: #666; }

        @media (max-width: 650px) {
            form { flex-direction: column; }
            .table-box { overflow-x: auto; }
            table { min-width: 600px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student manager</h1>

        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="studentName" placeholder="Student name" required>
            <input type="text" id="studentCourse" placeholder="Course" required>
            <button type="submit" id="saveButton">Add student</button>
        </form>

        <p id="message">Loading...</p>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>

        <p id="help">Clicking Edit fills the form above and the button becomes "Update student".</p>
    </div>

    <script>
        let url = "http://localhost:3000/students";

        // GET - show all students
        const getStudents = async () => {
            let response = await fetch(url);
            if (!response.ok) throw new Error("Unable to get students");
            return await response.json();
        };

        // POST - add a new student
        const addStudent = async (student) => {
            let response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            });

            if (!response.ok) throw new Error("Unable to add student");
        };

        // PATCH - update student details
        const updateStudent = async (id, student) => {
            let response = await fetch(url + "/" + id, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            });

            if (!response.ok) throw new Error("Unable to update student");
        };

        // DELETE - remove a student
        const deleteStudent = async (id) => {
            let response = await fetch(url + "/" + id, {
                method: "DELETE"
            });

            if (!response.ok) throw new Error("Unable to delete student");
        };

        async function showStudents() {
            let message = document.getElementById("message");
            let table = document.getElementById("studentList");

            message.innerText = "Loading...";

            try {
                let students = await getStudents();
                table.innerHTML = "";

                students.forEach(student => {
                    let row = document.createElement("tr");

                    let idCell = document.createElement("td");
                    idCell.innerText = student.id;

                    let nameCell = document.createElement("td");
                    nameCell.innerText = student.name;

                    let courseCell = document.createElement("td");
                    courseCell.innerText = student.course;

                    let actionCell = document.createElement("td");

                    let editButton = document.createElement("button");
                    editButton.innerText = "Edit";
                    editButton.onclick = function() {
                        editStudent(student);
                    };

                    let deleteButton = document.createElement("button");
                    deleteButton.innerText = "Delete";
                    deleteButton.onclick = function() {
                        removeStudent(student.id);
                    };

                    actionCell.append(editButton, deleteButton);
                    row.append(idCell, nameCell, courseCell, actionCell);
                    table.appendChild(row);
                });

                message.innerText = students.length === 0 ? "No students yet" : "";
            } catch (error) {
                message.innerText = "Error. Please start JSON Server on port 3000.";
            }
        }

        function editStudent(student) {
            document.getElementById("studentId").value = student.id;
            document.getElementById("studentName").value = student.name;
            document.getElementById("studentCourse").value = student.course;
            document.getElementById("saveButton").innerText = "Update student";
        }

        document.getElementById("studentForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            let id = document.getElementById("studentId").value;
            let name = document.getElementById("studentName").value.trim();
            let course = document.getElementById("studentCourse").value.trim();

            try {
                if (id === "") {
                    await addStudent({ name: name, course: course });
                    document.getElementById("message").innerText = "Student added";
                } else {
                    await updateStudent(id, { name: name, course: course });
                    document.getElementById("message").innerText = "Student updated";
                }

                this.reset();
                document.getElementById("studentId").value = "";
                document.getElementById("saveButton").innerText = "Add student";
                showStudents();
            } catch (error) {
                document.getElementById("message").innerText = error.message;
            }
        });

        async function removeStudent(id) {
            if (!confirm("Do you want to delete this student?")) return;

            try {
                await deleteStudent(id);
                document.getElementById("message").innerText = "Student deleted";
                showStudents();
            } catch (error) {
                document.getElementById("message").innerText = error.message;
            }
        }

        showStudents();
    </script>
</body>
</html>
